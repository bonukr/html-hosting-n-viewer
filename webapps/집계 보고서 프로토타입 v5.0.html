/* 모달 내부에서 SVG가 컨테이너에 맞춰 그려지도록 */
function ZoomSvg({ series, axis, stepObj, aggToggles, dateRange, points, unitLabel }) {
  const [size, setSize] = useState({ w: 1180, h: 560 });
  const wrapRef = React.useRef(null);
  React.useEffect(() => {
    if (!wrapRef.current) return;
    const ro = new ResizeObserver(() => {
      const r = wrapRef.current.getBoundingClientRect();
      setSize({ w: Math.max(400, r.width), h: Math.max(300, r.height) });
    });
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);
  return (
    <div ref={wrapRef} style={{width:'100%', height:'100%'}}>
      <LineSvg width={size.w} height={size.h} series={series} axis={axis} stepObj={stepObj} aggToggles={aggToggles} dateRange={dateRange} points={points} unitLabel={unitLabel} />
    </div>
  );
}

function ChartGrid({ category, stepObj, selectedTargets, selectedMetricIds, dateRange, onZoom }) {
  /* v5.0 (260519) 수정 — 세부 지표(metric id) 단위로 차트 카드 1개씩 나열.
     · 네트워크 송/수신(-r/-w)은 좌·우 페어로 같은 줄에 유지
     · 정렬 = METRIC_TREE 노출 순서 (카테고리 > 그룹 > leaf > id) */
  const NOTES_BY_ID = {
    'net-err-r':'계산 도출 (rx_errors / rx_packets × 100)',
    'net-err-w':'계산 도출 (tx_errors / tx_packets × 100)',
    'net-drop-r':'계산 도출 (rx_dropped / rx_packets × 100)',
    'net-drop-w':'계산 도출 (tx_dropped / tx_packets × 100)',
    'vm-net-err-r':'계산 도출 (rx_errors / rx_packets × 100)',
    'vm-net-err-w':'계산 도출 (tx_errors / tx_packets × 100)',
    'vm-net-drop-r':'계산 도출 (rx_dropped / rx_packets × 100)',
    'vm-net-drop-w':'계산 도출 (tx_dropped / tx_packets × 100)',
  };
  const orderedIds = useMemo(() => {
    const out = [];
    (METRIC_TREE[category] || []).forEach(g => g.leaves.forEach(l => (l.ids || [l.id]).forEach(id => out.push(id))));
    return out;
  }, [category]);
  const groups = useMemo(() => {
    const set = new Set(selectedMetricIds);
    return orderedIds.filter(id => set.has(id)).map(id => ({
      id,
      title: METRIC_LABELS[id] || id,
      parentName: METRIC_GROUP[id] || '—',
      unit: METRIC_UNITS[id] || '',
      members: [id],
      note: NOTES_BY_ID[id] || null,
    }));
  }, [orderedIds.join(','), selectedMetricIds.join(',')]);
  // Build rows so that read/write pairs (-r + -w) are always rendered side-by-side.
  const rows = useMemo(() => {
    const out = [];
    let buf = [];
    const flush = () => { if (buf.length) { out.push(buf); buf = []; } };
    let i = 0;
    while (i < groups.length) {
      const g = groups[i];
      const next = groups[i+1];
      const isPair = next && g.id.endsWith('-r') && next.id === g.id.slice(0,-2)+'-w';
      if (isPair) { flush(); out.push([g, next]); i += 2; }
      else { buf.push(g); if (buf.length === 2) flush(); i += 1; }
    }
    flush();
    return out;
  }, [groups.map(g=>g.id).join(',')]);
  return (
    <div className="wf-box" style={{padding: 12}}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom: 10}}>
        <h3 style={{margin:0, fontSize:13, letterSpacing:'.04em'}}>⑤ 차트 <span style={{color:'var(--ink-3)', fontWeight:400, textTransform:'none', letterSpacing:0}}>— <b style={{color:'var(--ink-2)'}}>세부 지표별 카드 1개</b> · 네트워크 송/수신은 좌·우 페어 · min/avg/max/median 4계열 토글 (default <b style={{color:'var(--ink-2)'}}>avg만</b>) · Y축 = 조회 기간 최대값 기준 자동 스케일 · 라인 호버 시 다값 툴팁</span></h3>
        <span className="wf-tag">{groups.length} charts</span>
      </div>
      {groups.length === 0 ? (
        <div className="wf-stripe" style={{padding: 40, textAlign:'center', color:'var(--ink-3)', border:'1px dashed var(--line)'}}>선택된 지표가 없습니다 — ② 지표 선택에서 1개 이상 선택하세요.</div>
      ) : (
        <div className="chart-rows">
          {rows.map((row, ri) => {
            const isPairRow = row.length === 2 && row[0].id.endsWith('-r') && row[1].id === row[0].id.slice(0,-2)+'-w';
            return (
              <div key={ri} className={'chart-grid' + (isPairRow ? ' pair-row' : '')}>
                {row.map(g => (
                  <ChartCard key={g.id} group={g} stepObj={stepObj} selectedTargets={selectedTargets} dateRange={dateRange} onZoom={onZoom} />
                ))}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   APP ROOT
   ============================================================ */

function App() {
  const [category, setCategory] = useState('host');
  const [projectId, setProjectId] = useState(null);
  const [search, setSearch] = useState('');
  const [selectedTargets, setSelectedTargets] = useState({ h1: true, h2: true, h4: true });
  const [selectedMetrics, setSelectedMetrics] = useState({
    'cpu-core': true, 'cpu-avg': true, 'mem-used': true, 'net-bw': true, 'net-err-r': true, 'disk-rate': true,
  });
  const [step, setStep] = useState('daily');
  const [dateRange, setDateRange] = useState(defaultRangeFor('daily'));
  const [infoMetric, setInfoMetric] = useState(null);
  /* v1.6: 차트 확대 + 저장 프리셋 */
  const [zoom, setZoom] = useState(null);
  const [savedPreset, setSavedPreset] = useState(null);

  /* v2.0 — 필터 편집 vs 적용 완료 상태 분리 (조회 깜빡 방지)
     applied 스냅샷이 ④ 표 + ⑤ 차트의 실제 소스. 편집은 위 state에서 일어나고
     [▷ 적용] 클릭 시점에 applied 로 커밋된다. 두 상태가 다르면 = dirty. */
  const initialApplied = {
    category: 'host', projectId: null,
    targets: { h1: true, h2: true, h4: true },
    metrics: { 'cpu-core': true, 'cpu-avg': true, 'mem-used': true, 'net-bw': true, 'net-err-r': true, 'disk-rate': true },
    step: 'daily', dateRange: defaultRangeFor('daily'),
  };
  const [applied, setApplied] = useState(initialApplied);
  const [lastAppliedAt, setLastAppliedAt] = useState(new Date());

  useEffect(() => {
    setSearch('');
    if (category === 'vm') {
      setProjectId('proj-a');
      setSelectedTargets({ v1: true, v2: true, v3: true });
    } else if (category === 'host') {
      setSelectedTargets({ h1: true, h2: true, h4: true });
    }
  }, [category]);

  useEffect(() => {
    const validIds = new Set((METRIC_TREE[category]||[]).flatMap(g => g.leaves.flatMap(l => l.ids || [l.id])));
    setSelectedMetrics(sm => {
      const next = {};
      Object.keys(sm).forEach(k => { if (validIds.has(k)) next[k] = sm[k]; });
      if (Object.keys(next).filter(k=>next[k]).length === 0) {
        const groups = METRIC_TREE[category]||[];
        [0,1,2].forEach(gi => {
          const leaf = groups[gi]?.leaves[0];
          if (leaf) leaf.ids.forEach(id => { next[id] = true; });
        });
      }
      return next;
    });
  }, [category]);

  useEffect(() => {
    setDateRange(defaultRangeFor(step));
  }, [step]);

  const stepObj = STEPS.find(s => s.id === step);

  const targetList = useMemo(() => {
    if (category === 'vm') return projectId ? (TARGETS.vm[projectId]||[]) : [];
    return TARGETS[category] || [];
  }, [category, projectId]);

  const chosenTargets = targetList.filter(t => selectedTargets[t.id]);
  const selectedMetricIds = Object.keys(selectedMetrics).filter(k => selectedMetrics[k]);

  /* ──── 적용 완료(applied) 측 파생값 — 표·차트는 이쪽을 본다 ──── */
  const appliedTargetList = useMemo(() => {
    if (applied.category === 'vm') return applied.projectId ? (TARGETS.vm[applied.projectId]||[]) : [];
    return TARGETS[applied.category] || [];
  }, [applied.category, applied.projectId]);
  const appliedChosen = appliedTargetList.filter(t => applied.targets[t.id]);
  const appliedMetricIds = Object.keys(applied.metrics).filter(k => applied.metrics[k]);
  const appliedStepObj = STEPS.find(s => s.id === applied.step);

  /* ──── dirty 비교 — 편집값 vs 적용값 ──── */
  const sigTargets = (s) => Object.keys(s).filter(k=>s[k]).sort().join(',');
  const sigMetrics = sigTargets;
  const diffs = useMemo(() => {
    const out = [];
    if (category !== applied.category) out.push(`카테고리 (${applied.category} → ${category})`);
    if (projectId !== applied.projectId && (category==='vm' || applied.category==='vm')) out.push('프로젝트 변경');
    const a = sigTargets(selectedTargets), b = sigTargets(applied.targets);
    if (a !== b) {
      const aSet = new Set(a.split(',').filter(Boolean));
      const bSet = new Set(b.split(',').filter(Boolean));
      const added = [...aSet].filter(x=>!bSet.has(x)).length;
      const removed = [...bSet].filter(x=>!aSet.has(x)).length;
      out.push(`① 대상 ${added?`+${added}`:''}${added&&removed?' / ':''}${removed?`-${removed}`:''}`);
    }
    const am = sigMetrics(selectedMetrics), bm = sigMetrics(applied.metrics);
    if (am !== bm) {
      const aSet = new Set(am.split(',').filter(Boolean));
      const bSet = new Set(bm.split(',').filter(Boolean));
      const added = [...aSet].filter(x=>!bSet.has(x)).length;
      const removed = [...bSet].filter(x=>!aSet.has(x)).length;
      out.push(`② 지표 ${added?`+${added}`:''}${added&&removed?' / ':''}${removed?`-${removed}`:''}`);
    }
    if (step !== applied.step) out.push(`③ step (${applied.step} → ${step})`);
    if (dateRange.start !== applied.dateRange.start || dateRange.end !== applied.dateRange.end) out.push('③ 날짜 범위');
    return out;
  }, [category, projectId, selectedTargets, selectedMetrics, step, dateRange, applied]);

          min = +(avg - r()*3).toFixed(2);
          max = +(avg + r()*4).toFixed(2);

          min = +(avg - r()*60).toFixed(2);
          max = +(avg + r()*120).toFixed(2);

          min = 0;
          max = +(avg + r()*0.6).toFixed(2);

          avg = +(r()*100).toFixed(2);
          min = +(Math.max(0, avg - r()*20)).toFixed(2);
          max = +(avg + r()*30).toFixed(2);

            <span>지표: <b>[조회] / [저장 — 계정 단위]</b> 버튼</span>
            <span>조회 조건: step별 <b>범위 제약 제거</b> · 차트 daily x축 <b>mm/dd</b> · 카드별 <b>[⌬ 확대]</b></span>
            <span>표: <b>세로 스크롤</b> · 4.2 요약 → RAW는 고도화(4.0 제외)</span>
            <span>로드맵 <s>3.0.6.1 제거</s> · 4.0 26'12/21 · 리팩토링 27'4월 · 미터링/중위값 검토</span>
          </div>
        </div>
      </div>

      <InfoPopup metricId={infoMetric} onClose={()=>setInfoMetric(null)} />
      <ChartZoomModal zoom={zoom} stepObj={stepObj} dateRange={dateRange} onClose={()=>setZoom(null)} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
