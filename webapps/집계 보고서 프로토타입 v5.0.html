<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>집계 보고서 — Lo-fi 프로토타입 (v5.0 / 260519)</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --ink: #1a1a1a; --ink-2: #4a4a4a; --ink-3: #8a8a8a;
    --line: #cfcfcf; --line-2: #e6e6e6;
    --paper: #fafaf7; --paper-2: #f1efe9;
    --hi: #ffe79a;
    --host: #378ADD; --vm: #1D9E75;
    --warn: #854f0b; --warn-bg: #faeeda;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #e9e7e1; color: var(--ink); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; line-height: 1.45; }
  button { font-family: inherit; font-size: inherit; color: inherit; }

  .wf-box { border: 1.5px solid var(--ink); background: #fff; }
  .wf-stripe { background-image: repeating-linear-gradient(135deg, transparent 0 8px, rgba(0,0,0,0.05) 8px 9px); }
  .wf-cap { background: var(--paper-2); border-bottom: 1.5px solid var(--ink); padding: 8px 14px; font-weight: 600; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .wf-cap .sub { color: var(--ink-3); font-weight: 400; font-size: 11px; }

  .wf-tag { display:inline-flex; align-items:center; gap:4px; padding: 2px 7px; border: 1px solid var(--ink); border-radius: 999px; background: #fff; font-size: 11px; cursor: pointer; user-select:none; }
  .wf-tag.on { background: var(--ink); color: #fff; }
  .wf-chip { display:inline-flex; align-items:center; gap:6px; padding: 3px 8px; border: 1px solid var(--ink); background: var(--hi); font-size:11px; }
  .wf-chip .x { cursor: pointer; opacity: .7; }

  .wf-btn { border: 1.5px solid var(--ink); background: #fff; padding: 5px 11px; cursor: pointer; font-weight: 500; font-size:12px; }
  .wf-btn:hover { background: var(--paper-2); }
  .wf-btn.primary { background: var(--ink); color: #fff; }
  .wf-btn.sm { padding: 3px 8px; font-size: 11px; }

  .wf-seg { display:inline-flex; border: 1.5px solid var(--ink); background:#fff; }
  .wf-seg button { border:0; background: transparent; padding: 5px 10px; cursor: pointer; border-right: 1px solid var(--line); }
  .wf-seg button:last-child { border-right: 0; }
  .wf-seg button.on { background: var(--ink); color: #fff; }

  .wf-check { width: 13px; height: 13px; border: 1.5px solid var(--ink); display:inline-flex; align-items:center; justify-content:center; background:#fff; flex:none; cursor:pointer; }
  .wf-check.on { background: var(--ink); color: #fff; font-size: 10px; }
  .wf-check.partial { background: var(--ink-3); color: #fff; font-size: 10px; }

  .wf-select {
    appearance: none; -webkit-appearance: none;
    border: 1.5px solid var(--ink); background: #fff;
    padding: 5px 26px 5px 10px; font: inherit;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    cursor: pointer;
  }

  .canvas { width: 1440px; margin: 24px auto; border: 2px solid var(--ink); background: #fff; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding: 9px 16px; border-bottom: 2px solid var(--ink); background: var(--paper-2); }
  .topbar .crumb { color: var(--ink-3); font-size: 12px; }
  .topbar .crumb b { color: var(--ink); }
  .topbar .meta { display:flex; gap:14px; align-items:center; font-size: 11px; color: var(--ink-3); }

  /* main column (no sidebar) */
  .body { padding: 14px 16px 28px; display:flex; flex-direction:column; gap:14px; background: var(--paper); min-height: 900px; }

  /* category tabs (top) */
  .cat-row { display:flex; gap:0; border: 1.5px solid var(--ink); background:#fff; }
  .cat-tab { padding: 10px 16px; cursor: pointer; display:flex; align-items:center; gap:10px; border-right: 1px solid var(--line-2); font-size: 13px; }
  .cat-tab:last-child { border-right: 0; }
  .cat-tab .dot { width:10px; height:10px; border:1.5px solid var(--ink); flex:none; }
  .cat-tab.host .dot { background: var(--host); }
  .cat-tab.vm .dot   { background: var(--vm); }
  .cat-tab.on { background: var(--ink); color: #fff; font-weight: 600; }
  .cat-tab.on .dot { border-color: #fff; }
  .cat-tab .sub { color: var(--ink-3); font-size: 11px; margin-left: 6px; }
  .cat-tab.on .sub { color: rgba(255,255,255,.65); }

  /* target panel */
  .target-pad { padding: 12px 14px; display:flex; flex-direction:column; gap:10px; }
  .target-row { display:flex; gap:14px; align-items:flex-start; }
  .target-row > .left { flex: 0 0 320px; display:flex; flex-direction:column; gap:8px; }
  .target-row > .right { flex: 1; display:flex; flex-direction:column; gap:8px; min-width: 0; }
  .search-row { display:flex; gap:6px; align-items:center; }
  .search-row input { flex:1; border: 1.5px solid var(--ink); padding: 5px 10px; font: inherit; background: #fff; }
  .target-grid { display:flex; flex-wrap:wrap; gap:5px; max-height: 110px; overflow-y:auto; padding: 2px; }
  .chip-summary { padding-top: 8px; border-top: 1px dashed var(--line); display:flex; flex-wrap:wrap; gap:5px; min-height: 24px; }
  .project-gate { border: 1.5px dashed var(--ink); background: var(--paper-2); padding: 14px; text-align: center; color: var(--ink-2); font-size: 12px; }
  .project-gate b { color: var(--ink); display:block; margin-bottom:4px; }

  /* metric tree — horizontal grid */
  .tree-cap-row { display:flex; align-items:center; gap:8px; }
  .tree-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 12px 14px; }
  .tree-col { border: 1px solid var(--line); background: #fff; display:flex; flex-direction:column; }
  .tree-col-head { padding: 7px 10px; background: var(--paper-2); border-bottom: 1px solid var(--ink); display:flex; align-items:center; gap:7px; cursor: pointer; user-select:none; }
  .tree-col-head .tree-name { flex: 1; font-weight: 600; font-size: 12.5px; }
  .tree-badge { font-size: 10px; padding: 1px 6px; border: 1px solid var(--ink); border-radius: 999px; background: #fff; }
  .tree-leaves { padding: 6px 10px 8px; display:flex; flex-direction:column; gap:5px; }
  .tree-leaf { display:flex; align-items:center; gap:7px; font-size: 12px; color: var(--ink-2); cursor:pointer; padding: 2px 0; }
  .tree-leaf:hover { color: var(--ink); }

  /* filter bar */
  .filter-bar { display:flex; align-items:center; gap:22px; flex-wrap:wrap; padding: 10px 14px; }
  .filter-bar .lbl { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin-right: 6px; }
  .filter-bar .field { display:flex; align-items:center; gap: 6px; }
  .filter-bar .hint { font-size: 11px; color: var(--ink-3); }
  .date-pick { display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--ink); padding: 4px 10px; background:#fff; cursor:pointer; }

  /* calendar popover */
  .cal-backdrop { position: fixed; inset:0; background: rgba(0,0,0,0.18); z-index: 50; }
  .cal-popover { position: absolute; top: calc(100% + 6px); right: 14px; z-index: 51; background:#fff; border: 1.5px solid var(--ink); box-shadow: 6px 6px 0 rgba(0,0,0,0.08); width: 640px; max-width: calc(100vw - 40px); }
  .cal-head { display:flex; align-items:center; gap:10px; padding: 10px 14px; border-bottom: 1.5px solid var(--ink); background: var(--paper-2); }
  .cal-body { padding: 12px 14px; }
  .cal-toggle-row { display:flex; align-items:center; gap:10px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--ink-4, #d0d0d0); }
  .cal-pick-lbl { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
  .cal-hint { font-size: 11px; color: var(--ink-3); margin-left: auto; }
  .cal-cols { display:grid; grid-template-columns: 1fr 200px; gap: 16px; }
  .cal-month-head { display:flex; align-items:center; gap:6px; margin-bottom: 8px; }
  .cal-dow { display:grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: 10px; color: var(--ink-3); text-align:center; margin-bottom: 4px; }
  .cal-dow .sun { color: #c33; }
  .cal-dow .sat { color: #36c; }
  .cal-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-cell { display:flex; align-items:center; justify-content:center; height: 32px; font-size: 12px; cursor: pointer; border: 1px solid transparent; user-select: none; }
  .cal-cell:hover { background: var(--paper-2); }
  .cal-cell.empty { cursor: default; }
  .cal-cell.empty:hover { background: transparent; }
  .cal-cell.in { background: #e8f0ff; }
  .cal-cell.edge { background: var(--ink); color: #fff; font-weight: 600; }
  .cal-cell.disabled { color: #c8c8c8; cursor: not-allowed; background: transparent; }
  .cal-cell.disabled:hover { background: transparent; }
  .cal-mgrid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .cal-mcell { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; height: 56px; font-size: 16px; font-weight:600; cursor:pointer; border: 1.5px solid var(--ink); background:#fff; }
  .cal-mcell:hover { background: var(--paper-2); }
  .cal-mcell.in { background: #e8f0ff; }
  .cal-mcell.edge { background: var(--ink); color: #fff; }
  .cal-mcell.disabled { color: #c8c8c8; border-color: #e2e2e2; cursor: not-allowed; background: transparent; }
  .cal-mcell.disabled:hover { background: transparent; }
  .cal-mlbl { font-size: 10px; font-weight: 400; opacity: .7; }
  .cal-side { display:flex; flex-direction:column; gap: 10px; padding-left: 14px; border-left: 1px dashed #d0d0d0; }
  .cal-side-row { display:flex; align-items:center; gap: 6px; flex-wrap: wrap; }
  .cal-side-lbl { font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; width: 30px; }
  .cal-side-val { font-size: 12px; font-weight: 600; }
  .cal-side-val.big { font-size: 14px; }
  .cal-preset-list { display:flex; flex-direction:column; gap: 4px; margin-top: 8px; padding-top: 10px; border-top: 1px dashed #d0d0d0; }
  .cal-foot { display:flex; align-items:center; gap: 10px; padding: 10px 14px; border-top: 1.5px solid var(--ink); background: var(--paper-2); }
  .cal-validity { font-size: 11px; flex: 1; }
  .cal-validity.ok { color: #2a7; }
  .cal-validity.bad { color: #c33; }

  .wf-box { position: relative; }

  /* table */
  .table-wrap { background: #fff; }
  .table-scroll { overflow-x: auto; max-width: 100%; }
  .data-table { width:100%; border-collapse: collapse; font-size: 12px; min-width: 900px; }
  .data-table th, .data-table td { border-bottom: 1px solid var(--line-2); padding: 7px 10px; text-align: left; vertical-align: middle; white-space: nowrap; }
  .data-table thead.lvl0 th { background: var(--paper-2); font-size: 11px; font-weight: 700; letter-spacing: .04em; border-bottom: 1px solid var(--ink); padding: 6px 10px; }
  .data-table thead.lvl1 th { background: var(--paper-2); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1.5px solid var(--ink); }
  .data-table thead.lvl2 th { background: #fff; font-size: 10.5px; color: var(--ink-3); font-weight: 500; border-bottom: 1px solid var(--ink); }
  .data-table thead th.lvl0 { background: var(--paper-2); font-size: 11px; font-weight: 700; letter-spacing: .04em; border-bottom: 1px solid var(--ink); padding: 6px 10px; }
  .data-table thead th.lvl1 { background: var(--paper-2); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1.5px solid var(--ink); }
  .data-table thead th.lvl2 { background: #fff; font-size: 10.5px; color: var(--ink-3); font-weight: 500; border-bottom: 1px solid var(--ink); }
  .data-table tbody tr:hover { background: var(--paper-2); }
  .num { font-variant-numeric: tabular-nums; }
  .num.min { color: var(--ink-3); }
  .num.max { color: var(--ink); font-weight: 600; }
  .num.avg { color: var(--ink-2); }

  .csv-bar { padding: 10px 14px; border-top: 1.5px solid var(--ink); background: var(--paper-2); display:flex; align-items:center; justify-content:space-between; gap: 14px; }
  .csv-bar .hint { font-size: 11.5px; color: var(--ink-3); }
  .csv-bar .hint b { color: var(--ink); }

  /* charts */
  .chart-rows { display:flex; flex-direction:column; gap: 12px; }
  .chart-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .chart-grid.pair-row { gap: 8px; }
  .chart-grid.pair-row .chart-card { border-color: var(--ink); }
  .chart-grid.pair-row .chart-card + .chart-card { border-left-width: 0.5px; }
  .chart-card { background: #fff; border: 1.5px solid var(--ink); display:flex; flex-direction:column; }
  .chart-head { padding: 9px 12px; border-bottom: 1px solid var(--ink); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .chart-title { font-weight: 600; display:flex; align-items:center; gap:6px; flex:1; min-width: 140px; }
  /* v5.0 (260519) 수정 — 지표 산정 근거 아이콘: i → ? (일괄 변경) */
  .info-i { display:inline-flex; width:14px; height:14px; border:1px solid var(--ink-3); border-radius:999px; font-size:10.5px; align-items:center; justify-content:center; color: var(--ink-3); cursor:pointer; font-weight: 700; font-family: inherit; line-height: 1; }
  .info-i:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
  .agg-toggles { display:inline-flex; gap:6px; align-items:center; font-size: 11px; }
  .agg-toggles label { display:inline-flex; align-items:center; gap: 4px; cursor: pointer; padding: 2px 6px; border: 1px solid var(--ink); background:#fff; }
  .agg-toggles label.on { background: var(--ink); color: #fff; }
  .chart-body { padding: 10px 12px 6px; }
  .chart-note { margin: 0 12px 10px; padding: 4px 8px; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); font-size: 10.5px; }
  .chart-legend { padding: 4px 12px 10px; display:flex; gap:10px; flex-wrap:wrap; font-size: 11px; color: var(--ink-2); }
  .lgnd-sw { width: 14px; height: 2px; display:inline-block; vertical-align: middle; margin-right: 4px; }

  .yaxis text, .xaxis text { fill: var(--ink-3); font-size: 9.5px; font-family: inherit; }
  .axis-line { stroke: var(--ink); stroke-width: 1; }
  .grid-line { stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 2 3; }

  .info-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index: 90; }
  .info-popup { width: min(560px, 92vw); background: #fff; border: 2px solid var(--ink); padding: 16px 18px; }
  .info-popup h4 { margin: 0 0 10px; font-size: 14px; }
  .info-popup dl { display:grid; grid-template-columns: 90px 1fr; gap: 4px 12px; font-size: 12px; }
  .info-popup dt { color: var(--ink-3); }
  .info-popup dd { margin: 0; }

  .legend-key { margin: 0 0 0; padding: 10px 14px; border: 1.5px dashed var(--ink-3); background: var(--paper-2); font-size: 11px; color: var(--ink-2); display:flex; gap: 18px; flex-wrap: wrap; }
  .legend-key b { color: var(--ink); }

  /* === v1.6 (260513 피드백) 추가 스타일 === */
  /* 아코디언 헤더 */
  .acc-cap { cursor: pointer; user-select: none; }
  .acc-cap:hover { background: #ece9df; }
  .acc-arrow { display:inline-block; width:14px; font-size:10px; color: var(--ink-2); }
  .acc-body { padding: 0; }
  .acc-collapsed-hint { padding: 8px 14px; font-size: 11px; color: var(--ink-3); border-top: 1px dashed var(--line); background: #fbfaf6; }

  /* 대상 선택 드롭다운 (체크박스) */
  .target-dd-wrap { position: relative; }
  .target-dd-btn { display:flex; align-items:center; justify-content:space-between; gap:8px; padding: 6px 12px; border: 1.5px solid var(--ink); background: #fff; cursor: pointer; min-width: 260px; font: inherit; }
  .target-dd-btn .ph { color: var(--ink-3); }
  .target-dd-menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; width: 360px; background: #fff; border: 1.5px solid var(--ink); box-shadow: 4px 4px 0 rgba(0,0,0,0.08); }
  .target-dd-search { padding: 8px 10px; border-bottom: 1px solid var(--line); display:flex; gap:6px; align-items:center; }
  .target-dd-search input { flex:1; border: 1.5px solid var(--ink); padding: 4px 8px; font: inherit; background: #fff; }
  .target-dd-list { max-height: 220px; overflow-y: auto; padding: 4px 0; }
  .target-dd-item { display:flex; align-items:center; gap:8px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
  .target-dd-item:hover { background: var(--paper-2); }
  .target-dd-item .grp { color: var(--ink-3); font-size: 10.5px; margin-left: auto; }
  .target-dd-foot { padding: 6px 10px; border-top: 1px solid var(--line); background: var(--paper-2); display:flex; gap:6px; align-items:center; justify-content: space-between; font-size: 11px; color: var(--ink-3); }

  /* 선택 완료 항목 리스트 (세로 스크롤) */
  .sel-list-box { border: 1px solid var(--line); background: #fff; }
  .sel-list-head { padding: 6px 10px; font-size: 11px; color: var(--ink-3); background: var(--paper-2); border-bottom: 1px solid var(--line); display:flex; justify-content: space-between; align-items: center; gap:8px; }
  .sel-list-head .lbl { text-transform: uppercase; letter-spacing: .06em; }
  .sel-list-head .cnt { color: var(--ink); font-weight: 600; }
  .sel-list-head .cnt.warn { color: var(--warn); }
  .sel-list-tools { display:flex; align-items:center; gap:6px; padding: 6px 10px; border-bottom: 1px dotted var(--line); background: #fbfaf6; }
  .sel-list-tools input { flex:1; border: 1.5px solid var(--ink); padding: 3px 8px; font: inherit; font-size: 11.5px; background: #fff; }
  .sel-list-tools .seg-mini { display:inline-flex; border: 1px solid var(--ink); background: #fff; }
  .sel-list-tools .seg-mini button { border:0; background: transparent; padding: 3px 7px; cursor: pointer; font-size: 11px; font-family: inherit; border-right: 1px solid var(--line); }
  .sel-list-tools .seg-mini button:last-child { border-right: 0; }
  .sel-list-tools .seg-mini button.on { background: var(--ink); color: #fff; }
  .sel-list-body { max-height: 280px; overflow-y: auto; padding: 4px 0; }
  .sel-list-body.grouped { padding: 0; }
  .sel-list-group { border-bottom: 1px dashed var(--line); }
  .sel-list-group:last-child { border-bottom: 0; }
  .sel-list-group-head { display:flex; align-items:center; gap:6px; padding: 4px 10px; background: #fbfaf6; cursor: pointer; user-select: none; font-size: 11px; color: var(--ink-2); position: sticky; top: 0; z-index: 1; }
  .sel-list-group-head:hover { background: var(--paper-2); }
  .sel-list-group-head .arr { width: 12px; font-size: 9px; color: var(--ink-3); }
  .sel-list-group-head .name { flex:1; }
  .sel-list-group-head .gcnt { color: var(--ink); font-weight: 600; }
  .sel-list-group-head .gclear { font-size: 10px; padding: 1px 6px; border: 1px solid var(--ink-3); background: #fff; cursor: pointer; color: var(--ink-2); }
  .sel-list-group-head .gclear:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
  .sel-list-row { display:flex; align-items:center; gap:8px; padding: 4px 10px 4px 26px; font-size: 12px; }
  .sel-list-row + .sel-list-row { border-top: 1px dotted var(--line-2); }
  .sel-list-row .name { flex:1; }
  .sel-list-row .grp { color: var(--ink-3); font-size: 10.5px; }
  .sel-list-row .x { cursor: pointer; opacity:.6; padding: 0 4px; }
  .sel-list-row .x:hover { opacity: 1; }
  .sel-list-empty { padding: 12px; text-align:center; color: var(--ink-3); font-size: 11px; }
  .sel-list-foot { padding: 5px 10px; border-top: 1px dashed var(--line); font-size: 10.5px; color: var(--ink-3); display:flex; justify-content:space-between; gap:8px; background: #fbfaf6; }
  .sel-list-foot .bar { flex:1; height: 4px; background: var(--line-2); position: relative; align-self: center; max-width: 160px; }
  .sel-list-foot .bar > span { display:block; height:100%; background: var(--ink); }
  .sel-list-foot .bar > span.warn { background: var(--warn); }

  /* 드롭다운 마스터 체크박스 행 */

/* STEP = 수집(데이터 하우징) 단위 = 차트 X축 최소 단위
   - hourly:  X축 1칸 = 1시간, 범위 ≤ 24h, 입력 YYYY.MM.DD HH ~ YYYY.MM.DD HH
   - daily:   X축 1칸 = 1일,   범위 ≤ 7일, 입력 YYYY.MM.DD ~ YYYY.MM.DD
   - weekly:  X축 1칸 = 1주,   범위 ≤ 4개월, 입력 YYYY.MM ~ YYYY.MM
   - monthly: X축 1칸 = 1개월, 범위 ≤ 12개월, 입력 YYYY.MM ~ YYYY.MM
*/
const STEPS = [
  { id: 'hourly',  label: 'hourly',  desc: '1시간 단위',  points: 24, xfmt: (i, r) => {
      if(!r) return String(i).padStart(2,'0');
      const [sd, sh] = r.start.split(' ');
      const dt = new Date(parseDay(sd).getTime() + ((+sh)+i)*3600000);
      /* hourly — 24시각 체계 HH만 표출 (날짜 겹침 방지) */
      return pad2(dt.getHours());
    } },
  { id: 'daily',   label: 'daily',   desc: '1일 단위',    points: 7,  xfmt: (i, r) => {
      if(!r) return String(i+1);
      const dt = new Date(parseDay(r.start).getTime() + i*86400000);
      return `${pad2(dt.getMonth()+1)}/${pad2(dt.getDate())}`;
    } },
  { id: 'weekly',  label: 'weekly',  desc: '1주 단위 (Sun-Sat · 일요일 시작)', points: 18, xfmt: (i, r) => {
      if(!r) return 'W'+(i+1);
      const p = parseWeekly(r.start);
      // ISO week +i: advance Monday by i*7 days, then read ISO week
      const mon = isoWeekStartDate(p.y, p.w);
      mon.setDate(mon.getDate() + i*7);
      const iso = isoWeekOf(mon);
      return `W${pad2(iso.w)}/${pad2(mon.getMonth()+1)}`;
    } },
  { id: 'monthly', label: 'monthly', desc: '1개월 단위',  points: 12, xfmt: (i, r) => {
      if(!r) return ['Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May'][i];
      const [sy, sm] = r.start.split('-').map(Number);
      const m0 = sy*12 + (sm-1) + i;
      const y = Math.floor(m0/12); const m = (m0%12) + 1;
      /* monthly — YY'mm 표기 (연·월 구분: e.g. 26'05) */
      return `${String(y).slice(-2)}'${pad2(m)}`;
    } },
];

/* ---------- date helpers ---------- */
const pad2 = (n) => String(n).padStart(2,'0');
function parseDay(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDay(dt){ return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`; }
function addDays(dt, n){ const d = new Date(dt); d.setDate(d.getDate()+n); return d; }
function diffDaysIncl(a, b){ return Math.round((parseDay(b)-parseDay(a))/86400000)+1; }
function diffMonthsIncl(a, b){ const [ay,am]=a.split('-').map(Number); const [by,bm]=b.split('-').map(Number); return (by-ay)*12+(bm-am)+1; }
function sameDay(a, b){ return a.getTime()===b.getTime(); }
function baseDateOf(end){
  if(!end) return '';
  if(end.includes(' ')){ const [d,h]=end.split(' '); return `${d} ${h}:00`; }
  if(end.length===7) return end + '-01';
  return end;
}
function defaultRangeFor(stepId){
  if(stepId==='hourly')  return { start:'2026-05-12 00', end:'2026-05-12 23' };
  if(stepId==='daily')   return { start:'2026-05-06', end:'2026-05-12' };
  if(stepId==='weekly')  return { start:'2026-W18', end:'2026-W22' };
  if(stepId==='monthly') return { start:'2025-06', end:'2026-05' };
  return { start:'', end:'' };
}
function fmtRangeDisplay(stepId, range){
  if(!range || !range.start) return '—';
  const dot = (s) => s.replaceAll('-','.');
  if(stepId==='hourly'){
    const [sd,sh] = range.start.split(' '); const [ed,eh] = range.end.split(' ');
    return `${dot(sd)} ${sh}시 ~ ${dot(ed)} ${eh}시`;
  }
  if(stepId==='weekly'){
    const ps = parseWeekly(range.start); const pe = parseWeekly(range.end);
    return `${ps.y}-${weekOrdinal(ps.w)} ~ ${pe.y}-${weekOrdinal(pe.w)}`;
  }
  return `${dot(range.start)} ~ ${dot(range.end)}`;
}
function endTokenForFile(stepId, range){
  if(stepId==='hourly') return range.end.replace(' ','_').replaceAll('-','');
  return range.end.replaceAll('-','');
}
function endLabelForTable(stepId, range){
  if(stepId==='hourly') { const [d,h]=range.end.split(' '); return `${d} ${h}:00`; }
  return range.end;
}
function monthsBetween(startStr, endStr){
  const [sy,sm]=startStr.split('-').map(Number); const [ey,em]=endStr.split('-').map(Number);
  const out=[]; let y=sy, m=sm;
  while(y<ey || (y===ey && m<=em)){ out.push(`${y}-${pad2(m)}`); m++; if(m>12){m=1;y++;} }
  return out;
}

/* v5.0 (260519) — 캘린더 시작일 = 일요일 일괄 적용. 주(week) 정의도 Sun-Sat 로 통일.
   주 1 = 1월 1일이 포함된 주 · 주의 시작 = 일요일.
   저장 포맷 = "YYYY-Www" (예: 2026-W19) — 외형은 동일, 의미만 Sun-Sat. */
function isoWeekOf(dt){
  /* Sun-Sat 기준 주차 산정 — 함수명은 호환 유지 (실 의미: Sun-Sat). */
  const d = new Date(dt.getTime()); d.setHours(0,0,0,0);
  // Move to Sunday of current week
  const sun = new Date(d); sun.setDate(d.getDate() - d.getDay());
  const y = sun.getFullYear();
  // First Sunday on/before Jan 1 of that year
  const jan1 = new Date(y, 0, 1);
  const firstSun = new Date(jan1); firstSun.setDate(jan1.getDate() - jan1.getDay());
  const w = Math.round((sun - firstSun) / (7 * 86400000)) + 1;
  return { y, w };
}
function isoWeekStartDate(isoYear, isoWeek){
  // Returns Sunday (00:00) of given Sun-Sat week
  const jan1 = new Date(isoYear, 0, 1);
  const firstSun = new Date(jan1); firstSun.setDate(jan1.getDate() - jan1.getDay());
  const out = new Date(firstSun); out.setDate(firstSun.getDate() + (isoWeek - 1) * 7);
  out.setHours(0,0,0,0);
  return out;
}
function isoWeeksInYear(year){
  return isoWeekOf(new Date(year, 11, 28)).w;
}
function parseWeekly(s){
  // Format: "YYYY-Www"  (예: 2026-W19)
  const m = (s||'').match(/^(\d{4})-W(\d{1,2})$/);
  if(!m) return { y: 2026, w: 1 };
  return { y: +m[1], w: +m[2] };
}
function fmtWeekly(y, w){ return `${y}-W${pad2(w)}`; }
function weekIdx(s){ const p = parseWeekly(s); return isoWeekStartDate(p.y, p.w).getTime(); }
function weeklyYM(s){ const p = parseWeekly(s); const st = isoWeekStartDate(p.y, p.w); return `${st.getFullYear()}-${pad2(st.getMonth()+1)}`; }
function weekOrdinal(n){ const s=['th','st','nd','rd'],v=n%100; return n + (s[(v-20)%10] || s[v] || s[0]); }

function effectivePoints(stepId, range){
  if(!range || !range.start) return 1;
  if(stepId==='hourly'){
    const [sd,sh] = range.start.split(' '); const [ed,eh] = range.end.split(' ');
    const s = new Date(parseDay(sd).getTime() + (+sh)*3600000);
    const e = new Date(parseDay(ed).getTime() + (+eh)*3600000);
    return Math.max(1, Math.min(200, Math.round((e-s)/3600000) + 1));
  }
  if(stepId==='daily') return Math.max(1, Math.min(200, diffDaysIncl(range.start, range.end)));
  if(stepId==='weekly'){
    return Math.max(1, Math.min(200, Math.round((weekIdx(range.end) - weekIdx(range.start)) / (7*86400000)) + 1));
  }
  if(stepId==='monthly') return Math.max(1, Math.min(200, diffMonthsIncl(range.start, range.end)));
  return 12;
}

function seedRand(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0x100000000; };
}
function genSeries(seed, points, base, amp, floor=0, ceil=100) {
  const r = seedRand(seed);
  const out = [];
  let cur = base + (r() - 0.5) * amp * 0.4;
  for (let i = 0; i < points; i++) {
    cur += (r() - 0.5) * amp * 0.6;
    cur = Math.max(floor, Math.min(ceil, cur));
    const avg = cur;
    const min = Math.max(floor, avg - r() * amp * 0.6);
    const max = Math.min(ceil, avg + r() * amp * 0.6);
    /* v5.0 — median: min~max 범위 안, avg에서 약간 어긋난 값 (실분포 시 avg와 median은 차이남) */
    const median = Math.max(min, Math.min(max, avg + (r() - 0.5) * amp * 0.35));
    out.push({ min: +min.toFixed(2), max: +max.toFixed(2), avg: +avg.toFixed(2), median: +median.toFixed(2) });
  }
  return out;
}
function metricAxis(groupId, allValues, unit) {
  /* v5.0 (260519) 수정 — Y축은 조회 기간 내 최대값 기준으로 자동 산정.
     · 모든 지표 공통: lo=0, hi = ceil(max × 1.15) (단위별로 보기 좋은 라운딩)
     · max=0 인 경우 단위별 기본 스케일 사용 */
  const m = groupId || '';
  const maxV = allValues && Number.isFinite(allValues.max) ? allValues.max : 0;
  if (maxV <= 0) {
    if (unit === '%') return { lo: 0, hi: 100 };
    if (unit && unit.includes('GB')) return { lo: 0, hi: 64 };
    if (unit && unit.includes('Mbps')) return { lo: 0, hi: 500 };
    if (unit && unit.includes('pkt')) return { lo: 0, hi: 5000 };
    if (m.includes('disk-io')) return { lo: 0, hi: 200 };
    return { lo: 0, hi: 100 };
  }
  const target = maxV * 1.15;
  /* 보기 좋은 단위로 ceil */
  const stepSize = (v) => {
    if (v <= 2)   return 0.2;
    if (v <= 5)   return 0.5;
    if (v <= 10)  return 1;
    if (v <= 50)  return 5;
    if (v <= 100) return 10;
    if (v <= 500) return 25;
    if (v <= 1000) return 50;
    if (v <= 5000) return 200;
    if (v <= 10000) return 500;
    if (v <= 50000) return 2000;
    return Math.pow(10, Math.floor(Math.log10(v)) - 1);
  };
  const s = stepSize(target);
  const hi = Math.ceil(target / s) * s;
  return { lo: 0, hi };
}

                <span className="tree-name">{g.name}
                  {g.tag && <span style={{marginLeft:5, fontSize:9, padding:'1px 5px', background:'var(--hi)', border:'1px solid var(--ink)', fontWeight:600, letterSpacing:'.04em'}}>{g.tag}</span>}
                </span>
                <span className="tree-badge">{selCount}/{total}</span>
              </div>
              <div className="tree-leaves">
                {g.leaves.map(l => {
                  const on = isLeafOn(l);
                  return (
                    <div key={l.id} className="tree-leaf" onClick={() => onToggleLeaf(l)}>
                      <span className={'wf-check ' + (on ? 'on' : '')}>{on ? '✓' : ''}</span>
                      <span style={{flex:1}}>{l.label}</span>
                      <span className="info-i" title="지표 산정 근거" onClick={(e)=>{e.stopPropagation(); onInfo(l.ids[0]);}}>?</span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </Accordion>
  );
}

function CalendarPopover({ step, stepObj, dateRange, setDateRange, onClose }){
  const [draft, setDraft] = useState(dateRange);
  const [pickEnd, setPickEnd] = useState(false);
  const initMonth = (() => {
    if(step==='hourly') return parseDay(draft.start.split(' ')[0]);
    if(step==='daily')  return parseDay(draft.start);
    if(step==='weekly') { const p = parseWeekly(draft.start); const mon = isoWeekStartDate(p.y, p.w); return new Date(mon.getFullYear(), mon.getMonth(), 1); }
    return new Date(+draft.start.split('-')[0], +draft.start.split('-')[1]-1, 1);
  })();
  const [cursor, setCursor] = useState(new Date(initMonth.getFullYear(), initMonth.getMonth(), 1));
  const validity = useMemo(()=>{
    /* v1.9: 명확한 유효성 메시지 — 시작 ≤ 종료 검증 */
    if(step==='hourly'){
      const [sd,sh]=draft.start.split(' '); const [ed,eh]=draft.end.split(' ');
      const s = new Date(parseDay(sd).getTime() + (+sh)*3600000);
      const e = new Date(parseDay(ed).getTime() + (+eh)*3600000);
      if(e<s) return { ok:false, msg:'⚠ 수집 종료 일시는 수집 시작 이후로 지정하세요' };
      if(e===s) return { ok:false, msg:'⚠ 수집 시작과 수집 종료가 동일합니다' };
      const hrs = Math.round((e-s)/3600000);
      return { ok:true, msg:`✓ ${hrs+1}시간 선택 (수집 시작 ≤ 수집 종료 · 양끝 포함)` };
    }
    if(step==='daily'){
      const days = diffDaysIncl(draft.start, draft.end);
      if(days<=0) return { ok:false, msg:'⚠ 수집 종료일은 수집 시작일 이후로 지정하세요' };
      return { ok:true, msg:`✓ ${days}일 선택 (수집 시작 ≤ 수집 종료 · 양끝 포함)` };
    }
    if(step==='weekly'){
      const sw = weekIdx(draft.start); const ew = weekIdx(draft.end);
      if(ew<sw) return { ok:false, msg:'⚠ 수집 종료 주차는 수집 시작 주차 이후로 지정하세요' };
      const weeks = Math.round((ew - sw) / (7*86400000)) + 1;
      return { ok:true, msg:`✓ ${weeks}주 선택 (수집 시작 ≤ 수집 종료 · Sun-Sat 일요일 시작)` };
    }
    /* monthly */
    const months = diffMonthsIncl(draft.start, draft.end);
    if(months<=0) return { ok:false, msg:'⚠ 수집 종료 월은 수집 시작 월 이후로 지정하세요' };
    return { ok:true, msg:`✓ ${months}개월 선택 (수집 시작 ≤ 수집 종료 · 양끝 포함)` };
  }, [draft, step]);
  const apply = () => { if(validity.ok){ setDateRange(draft); onClose(); } };
  return (
    <>
      <div className="cal-backdrop" onClick={onClose}></div>
      <div className="cal-popover" style={(step==='weekly' || step==='daily' || step==='hourly') ? {width: 720} : undefined}>
        <div className="cal-head">
          <span style={{fontWeight:600}}>수집 기간 선택</span>
          <span style={{color:'var(--ink-3)', fontSize:11}}>step = <b style={{color:'var(--ink)'}}>{stepObj.label}</b> · {stepObj.desc} · <em style={{background:'var(--hi)', padding:'0 4px', fontStyle:'normal'}}>&lt;a-range-picker picker="{step === 'weekly' ? 'week' : step === 'monthly' ? 'month' : 'date'}"&gt;</em></span>
          <button className="wf-btn sm" onClick={onClose} style={{marginLeft:'auto'}}>✕</button>
        </div>
        {step==='hourly' && <HourlyPicker cursor={cursor} setCursor={setCursor} draft={draft} setDraft={setDraft} pickEnd={pickEnd} setPickEnd={setPickEnd} />}
        {step==='daily'  && <DailyPicker  cursor={cursor} setCursor={setCursor} draft={draft} setDraft={setDraft} pickEnd={pickEnd} setPickEnd={setPickEnd} />}
        {step==='weekly' && <WeeklyPicker cursor={cursor} setCursor={setCursor} draft={draft} setDraft={setDraft} pickEnd={pickEnd} setPickEnd={setPickEnd} />}
        {step==='monthly' && <MonthPicker cursor={cursor} setCursor={setCursor} draft={draft} setDraft={setDraft} />}
        <div className="cal-foot">
          <span className={'cal-validity ' + (validity.ok?'ok':'bad')}>{validity.ok?'✓':'⚠'} {validity.msg}</span>
          <div style={{display:'flex', gap:6}}>
            <button className="wf-btn sm" onClick={()=>setDraft(defaultRangeFor(step))}>초기화</button>
            <button className="wf-btn sm" onClick={onClose}>취소</button>
            <button className="wf-btn sm primary" disabled={!validity.ok} onClick={apply} style={{opacity:validity.ok?1:.4, cursor:validity.ok?'pointer':'not-allowed'}}>적용</button>
          </div>
        </div>
      </div>
    </>
  );
}

function MonthGrid({ cursor, setCursor, isInRange, isEdge, onPickDay, isDisabled }){
  const startWeekday = new Date(cursor.getFullYear(), cursor.getMonth(), 1).getDay();
  const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length%7) cells.push(null);
  return (
    <div className="cal-month">
      <div className="cal-month-head">
        <button className="wf-btn sm" onClick={()=>setCursor(new Date(cursor.getFullYear(), cursor.getMonth()-1, 1))}>‹</button>
        <span style={{flex:1, textAlign:'center', fontWeight:600}}>{cursor.getFullYear()}.{pad2(cursor.getMonth()+1)}</span>
        <button className="wf-btn sm" onClick={()=>setCursor(new Date(cursor.getFullYear(), cursor.getMonth()+1, 1))}>›</button>
      </div>
      <div className="cal-dow">
        {['S','M','T','W','T','F','S'].map((d,i)=>(<span key={i} className={i===0?'sun':i===6?'sat':''}>{d}</span>))}
      </div>
      <div className="cal-grid">
        {cells.map((d, idx) => {
          if(!d) return <span key={idx} className="cal-cell empty"></span>;
          const dt = new Date(cursor.getFullYear(), cursor.getMonth(), d);
          const inR = isInRange(dt); const edge = isEdge(dt);
          const dis = isDisabled ? isDisabled(dt) : false;
          return <span key={idx} className={'cal-cell ' + (inR?'in ':'') + (edge?'edge ':'') + (dis?'disabled':'')} onClick={()=>{ if(!dis) onPickDay(dt); }}>{d}</span>;
        })}
      </div>
    </div>
  );
}

function HourlyPicker({ cursor, setCursor, draft, setDraft, pickEnd, setPickEnd }){
  /* v5.0 (260519) 추가 요청 — hourly 캘린더를 daily와 동일하게 좌·우 듀얼 캘린더로 통일.
     시간(HH) 선택 UI 제거 → 내부 포맷은 호환 유지 ("YYYY-MM-DD HH")
     · 수집 시작 = 선택일 00시
     · 수집 종료 = 선택일 23시 (HH:00 ~ HH:59 = 24시간 분량 시간 단위 집계) */
  const [sDay] = draft.start.split(' ');
  const [eDay] = draft.end.split(' ');
  const FIXED_S_HOUR = '00';
  const FIXED_E_HOUR = '23';
  const startDt = parseDay(sDay); const endDt = parseDay(eDay);
  const sIdx = startDt.getTime(); const eIdx = endDt.getTime();
  const [hover, setHover] = useState(null);

  const leftY = cursor.getFullYear(), leftM = cursor.getMonth();
  const rightDate = new Date(leftY, leftM + 1, 1);
  const rightY = rightDate.getFullYear(), rightM = rightDate.getMonth();

  const onPickDay = (dt) => {
    const idx = dt.getTime();
    if(!pickEnd){
      if(idx > eIdx) return;
      setDraft({ start: fmtDay(dt) + ' ' + FIXED_S_HOUR, end: draft.end });
      setPickEnd(true);
    } else {
      if(idx < sIdx) return;
      setDraft({ start: draft.start, end: fmtDay(dt) + ' ' + FIXED_E_HOUR });
    }
  };

  function MonthCal({ year, month }){
    const firstOfMonth = new Date(year, month, 1);
    const firstSunOffset = firstOfMonth.getDay();
    const firstSun = new Date(year, month, 1 - firstSunOffset);
    const weeks = [];
    let cur = new Date(firstSun);
    for(let wi=0; wi<6; wi++){
      const row = [];
      for(let i=0; i<7; i++){
        row.push(new Date(cur));
        cur.setDate(cur.getDate() + 1);
      }
      const anyInMonth = row.some(d => d.getMonth() === month);
      if(wi >= 4 && !anyInMonth) break;
      weeks.push(row);
    }
    const monthLabel = ['January','February','March','April','May','June','July','August','September','October','November','December'][month];
    return (
      <div className="week-cal">
        <div className="week-cal-head">{monthLabel} {year}</div>
        <div className="week-cal-dow">
          <span className="we">Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span className="sa">Sa</span>
        </div>
        {weeks.map((wk, wi) => (
          <div key={wi} className="day-cal-row">
            {wk.map((d, di) => {
              const sameMonth = d.getMonth() === month;
              const idx = d.getTime();
              const inRange = idx >= sIdx && idx <= eIdx;
              const isEdge  = idx === sIdx || idx === eIdx;
              const isHover = hover === idx;
              const dis = !pickEnd ? idx > eIdx : idx < sIdx;
              const cls = 'day-cal-cell '
                + (sameMonth ? '' : 'out ')
                + (isEdge ? 'edge ' : (inRange ? 'in ' : (isHover ? 'hov ' : '')))
                + (dis ? 'dis' : '');
              return (
                <span key={di} className={cls}
                      onMouseEnter={()=>!dis && sameMonth && setHover(idx)}
                      onMouseLeave={()=>setHover(null)}

function DailyPicker({ cursor, setCursor, draft, setDraft, pickEnd, setPickEnd }){
  /* v4.0 (260515) — a-range-picker picker="date" 표준 사용성
     · 좌·우 듀얼 캘린더 (현재월 + 다음월), 일자 단위 클릭 선택
     · 헤더에 「수집 시작 → 수집 종료」 입력 필드 (활성 입력엔 파란 밑줄) */
  const startDt = parseDay(draft.start); const endDt = parseDay(draft.end);
  const sIdx = startDt.getTime(); const eIdx = endDt.getTime();
  const [hover, setHover] = useState(null);

  const leftY = cursor.getFullYear(), leftM = cursor.getMonth();
  const rightDate = new Date(leftY, leftM + 1, 1);
  const rightY = rightDate.getFullYear(), rightM = rightDate.getMonth();

  const onPickDay = (dt) => {
    const idx = dt.getTime();
    if(!pickEnd){
      if(idx > eIdx) return;
      setDraft({ start: fmtDay(dt), end: draft.end });
      setPickEnd(true);
    } else {
      if(idx < sIdx) return;
      setDraft({ start: draft.start, end: fmtDay(dt) });
    }
  };

  function MonthCal({ year, month }){
    const firstOfMonth = new Date(year, month, 1);
    /* v5.0 — 일요일 시작 */
    const firstSunOffset = firstOfMonth.getDay(); // Sun=0..Sat=6
    const firstSun = new Date(year, month, 1 - firstSunOffset);
    const weeks = [];
    let cur = new Date(firstSun);
    for(let wi=0; wi<6; wi++){
      const row = [];
      for(let i=0; i<7; i++){
        row.push(new Date(cur));
        cur.setDate(cur.getDate() + 1);
      }
      const anyInMonth = row.some(d => d.getMonth() === month);
      if(wi >= 4 && !anyInMonth) break;
      weeks.push(row);
    }
    const monthLabel = ['January','February','March','April','May','June','July','August','September','October','November','December'][month];
    return (
      <div className="week-cal">
        <div className="week-cal-head">{monthLabel} {year}</div>
        <div className="week-cal-dow">
          <span className="we">Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span className="sa">Sa</span>
        </div>
        {weeks.map((wk, wi) => (
          <div key={wi} className="day-cal-row">
            {wk.map((d, di) => {
              const sameMonth = d.getMonth() === month;
              const idx = d.getTime();
              const inRange = idx >= sIdx && idx <= eIdx;
              const isEdge  = idx === sIdx || idx === eIdx;
              const isHover = hover === idx;
              const dis = !pickEnd ? idx > eIdx : idx < sIdx;
              const cls = 'day-cal-cell '
                + (sameMonth ? '' : 'out ')
                + (isEdge ? 'edge ' : (inRange ? 'in ' : (isHover ? 'hov ' : '')))
                + (dis ? 'dis' : '');
              return (
                <span key={di} className={cls}
                      onMouseEnter={()=>!dis && sameMonth && setHover(idx)}
                      onMouseLeave={()=>setHover(null)}
                      onClick={()=>!dis && sameMonth && onPickDay(d)}
                      title={fmtDay(d)}>
                  {d.getDate()}
                </span>
              );
            })}
          </div>
        ))}
      </div>
    );
  }

  return (
    <div className="cal-body" style={{padding:0}}>
      {/* v5.0 (260519) 수정 — [수집 시작 / 수집 종료] 토글 버튼 제거 */}
      <div className="week-rp-input">
        <div className={'field ' + (!pickEnd ? 'on' : '')} onClick={()=>setPickEnd(false)}>
          <span className="iso">{draft.start}</span>
          <span className="cal-ico">📅</span>
        </div>
        <span className="arrow">→</span>
        <div className={'field ' + (pickEnd ? 'on' : '')} onClick={()=>setPickEnd(true)}>
          <span className="iso">{draft.end}</span>
          <span className="cal-ico">📅</span>
        </div>
      </div>
      <div className="week-cal-cols">
        <div className="week-cal-nav">
          <button onClick={()=>setCursor(new Date(leftY-1, leftM, 1))} title="이전 연도">«</button>
          <button onClick={()=>setCursor(new Date(leftY, leftM-1, 1))} title="이전 달">‹</button>
        </div>
        <MonthCal year={leftY} month={leftM} />
        <MonthCal year={rightY} month={rightM} />
        <div className="week-cal-nav">
          <button onClick={()=>setCursor(new Date(leftY, leftM+1, 1))} title="다음 달">›</button>
          <button onClick={()=>setCursor(new Date(leftY+1, leftM, 1))} title="다음 연도">»</button>
        </div>
      </div>
      <div className="week-cal-foot-hint">
        <code>&lt;a-range-picker picker="date"&gt;</code> · 일자 셀 클릭 시 「수집 시작 / 수집 종료」에 반영됩니다 · <b>양끝 일시 모두 포함</b> (수집 시작일 00:00 ~ 수집 종료일 24:00)
      </div>

  );
}

function WeeklyPicker({ cursor, setCursor, draft, setDraft, pickEnd, setPickEnd }){
  /* v4.0 (260515) — a-range-picker picker="week" 표준 사용성
     · 좌·우 듀얼 캘린더 (현재월 + 다음월)
     · 마우스 오버 시 해당 주(행) 하이라이트 · 클릭 시 주차 선택
     · v5.0 — 주 시작 = 일요일 (Sun-Sat) · 캘린더 시작일 일괄 일요일 적용 */
  const ps = parseWeekly(draft.start);
  const pe = parseWeekly(draft.end);
  const sIdx = weekIdx(draft.start);
  const eIdx = weekIdx(draft.end);
  const [hover, setHover] = useState(null); // { ms } — Monday timestamp of hovered week

  const leftY = cursor.getFullYear(), leftM = cursor.getMonth();
  const rightDate = new Date(leftY, leftM + 1, 1);
  const rightY = rightDate.getFullYear(), rightM = rightDate.getMonth();

  const onPickWeek = (isoY, isoW) => {
    const wk = fmtWeekly(isoY, isoW);
    const idx = isoWeekStartDate(isoY, isoW).getTime();
    if(!pickEnd){
      if(idx > eIdx) return;
      setDraft({ start: wk, end: draft.end });
      setPickEnd(true);
    } else {
      if(idx < sIdx) return;
      setDraft({ start: draft.start, end: wk });
    }
  };

  function MonthCal({ year, month }){
    const firstOfMonth = new Date(year, month, 1);
    /* v5.0 — 일요일 시작 (주 정의도 Sun-Sat) */
    const firstSunOffset = firstOfMonth.getDay();
    const firstSun = new Date(year, month, 1 - firstSunOffset);

    /* Build 6 week rows from firstSun (each row = Sun..Sat) */
    const weeks = [];
    let cur = new Date(firstSun);
    for(let wi=0; wi<6; wi++){
      const row = { days: [], sun: new Date(cur) };
      for(let i=0; i<7; i++){
        row.days.push(new Date(cur));
        cur.setDate(cur.getDate() + 1);
      }
      const iso = isoWeekOf(row.sun);
      row.isoY = iso.y; row.isoW = iso.w;
      row.idx = isoWeekStartDate(iso.y, iso.w).getTime();
      /* Skip last row if all 7 days fall outside this month (avoid full-grey trailing row) */
      const anyInMonth = row.days.some(d => d.getMonth() === month);
      if(wi >= 4 && !anyInMonth) break;
      weeks.push(row);
    }
    const monthLabel = ['January','February','March','April','May','June','July','August','September','October','November','December'][month];
    return (
      <div className="week-cal">
        <div className="week-cal-head">{monthLabel} {year}</div>
        <div className="week-cal-dow">
          <span className="we">Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span className="sa">Sa</span>
        </div>
        {weeks.map((wk, wi) => {
          const inRange = wk.idx >= sIdx && wk.idx <= eIdx;
          const isEdge  = (wk.idx === sIdx) || (wk.idx === eIdx);
          const isHover = hover && hover === wk.idx;
          const dis = !pickEnd ? wk.idx > eIdx : wk.idx < sIdx;
          const cls = 'week-cal-row '
            + (isEdge ? 'edge ' : (inRange ? 'in ' : (isHover ? 'hov ' : '')))
            + (dis ? 'dis' : '');
          return (
            <div key={wi} className={cls}
                 onMouseEnter={() => !dis && setHover(wk.idx)}
                 onMouseLeave={() => setHover(null)}
                 onClick={() => !dis && onPickWeek(wk.isoY, wk.isoW)}
                 title={`${wk.isoY}-W${pad2(wk.isoW)} · ${fmtDay(wk.days[0])} ~ ${fmtDay(wk.days[6])} (Sun-Sat)`}>
              {wk.days.map((d, di) => {
                const sameMonth = d.getMonth() === month;
                return <span key={di} className={'week-cal-cell ' + (sameMonth ? '' : 'out')}>{d.getDate()}</span>;
              })}
            </div>
          );
        })}
      </div>
    );
  }

  return (
    <div className="cal-body" style={{padding:0}}>
      {/* v5.0 (260519) 수정 — [수집 시작 / 수집 종료] 토글 버튼 제거 */}
      {/* 헤더 입력 (ISO 주차 ordinal 표시) */}
      <div className="week-rp-input">
        <div className={'field ' + (!pickEnd ? 'on' : '')} onClick={()=>setPickEnd(false)}>
          <span className="iso">{ps.y}-{weekOrdinal(ps.w)}</span>
          <span style={{color:'var(--ink-3)', fontSize:11}}>(W{pad2(ps.w)})</span>
          <span className="cal-ico">📅</span>
        </div>
        <span className="arrow">→</span>
        <div className={'field ' + (pickEnd ? 'on' : '')} onClick={()=>setPickEnd(true)}>
          <span className="iso">{pe.y}-{weekOrdinal(pe.w)}</span>
          <span style={{color:'var(--ink-3)', fontSize:11}}>(W{pad2(pe.w)})</span>
          <span className="cal-ico">📅</span>
        </div>
      </div>
      {/* 듀얼 캘린더 */}
      <div className="week-cal-cols">
        <div className="week-cal-nav">
          <button onClick={()=>setCursor(new Date(leftY-1, leftM, 1))} title="이전 연도">«</button>
          <button onClick={()=>setCursor(new Date(leftY, leftM-1, 1))} title="이전 달">‹</button>
        </div>
        <MonthCal year={leftY} month={leftM} />
        <MonthCal year={rightY} month={rightM} />
        <div className="week-cal-nav">
          <button onClick={()=>setCursor(new Date(leftY, leftM+1, 1))} title="다음 달">›</button>
          <button onClick={()=>setCursor(new Date(leftY+1, leftM, 1))} title="다음 연도">»</button>
        </div>
      </div>
      <div className="week-cal-foot-hint">
        <code>&lt;a-range-picker picker="week"&gt;</code> · 행에 마우스 오버 시 해당 주가 하이라이트되며, 클릭 시 「수집 시작/종료」에 반영됩니다 · <b>주 시작일 = 일요일 (Sun-Sat)</b> — v5.0 (260519) · 캘린더 시작일 일괄 적용
      </div>
    </div>
  );
}

    const [y,m] = mk.split('-').map(Number);
    const idx = y*12+(m-1);
    if(!pickEnd){
      if(idx > eIdx) return;
      setDraft({ start: mk, end: draft.end });
      setPickEnd(true);
    } else {
      if(idx < sIdx) return;
      setDraft({ start: draft.start, end: mk });

const STATE_METRIC_IDS = new Set(['m-life', 'm-active', 'm-active-rate']);
/* v2.0 — 정수로 표기해야 하는 지표 (개수 단위) */
const INT_METRIC_IDS = new Set(['m-vol-cnt', 'm-vcpu']);
const METER_NO_MIN_IDS = new Set(['m-vol-cnt', 'm-vol-size', 'm-vcpu', 'm-vmem']);
/* v2.0 재편 — «일반 지표» 탭 (인스턴스 상태 + 미터링 용량). 그 외 전부는 «성능 지표» 탭 */
const GENERAL_METRIC_IDS = new Set(['m-life','m-active','m-active-rate','m-vol-cnt','m-vol-size','m-vcpu','m-vmem']);
const GENERAL_ORDER = ['m-life','m-active','m-active-rate','m-vol-cnt','m-vol-size','m-vcpu','m-vmem'];
/* v5.0 (260519) — median(중위값) 4번째 수집 항목 추가. 모든 성능 지표는 min/avg/max/median 4계열 */
const aggColsFor = (m) => {
  if (STATE_METRIC_IDS.has(m)) return ['sum'];                  // 상태 — 누적값 단일 컬럼
  if (METER_NO_MIN_IDS.has(m)) return ['avg', 'max', 'median']; // 미터링 용량 — min 제외 + median
  return ['min', 'avg', 'max', 'median'];                       // 성능 — 4계열 전부 (v5.0)
};
/* 차트 시리즈별 색상 매핑 (median = 점선) */
const AGG_STYLE = {
  min:    { dash: '2 3',     op: .50, w: 1.1, label: 'min' },
  max:    { dash: '4 2',     op: .85, w: 1.1, label: 'max' },
  avg:    { dash: null,      op: 1.0, w: 1.8, label: 'avg' },

};

function tickLabel(stepId, range, idx){
  if(stepId==='hourly'){
    const [sd, sh] = range.start.split(' ');
    const dt = new Date(parseDay(sd).getTime() + ((+sh)+idx)*3600000);
    return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())} ${pad2(dt.getHours())}시`;
  }
  if(stepId==='daily'){
    const dt = new Date(parseDay(range.start).getTime() + idx*86400000);
    return fmtDay(dt);
  }
  if(stepId==='weekly'){
    const p = parseWeekly(range.start);
    const mon = isoWeekStartDate(p.y, p.w);
    mon.setDate(mon.getDate() + idx*7);
    const iso = isoWeekOf(mon);
    return `${iso.y}-W${pad2(iso.w)}`;
  }
  const [sy,sm] = range.start.split('-').map(Number);
  const m0 = sy*12 + (sm-1) + idx;
  const y = Math.floor(m0/12); const m = (m0%12)+1;
  return `${y}-${pad2(m)}`;
}
function tickColumnLabel(stepId){
  if(stepId==='hourly')  return '수집 기준 일시 (YYYY-MM-DD HH시)';
  if(stepId==='daily')   return '수집 기준 일자 (YYYY-MM-DD)';
  if(stepId==='weekly')  return '수집 기준 주차 (YYYY-Www · Sun-Sat)';
  return '수집 기준 월 (YYYY-MM)';
}

function DataTable({ selectedTargets, selectedMetricIds, metricMap, tableData, stepObj, dateRange, onCsv, category }) {
  /* 같은 그룹(CPU/메모리/네트워크/...) 컬럼이 연속되도록 정렬 → lvl0 그룹 span 분리 방지 */
  const groupOrder = useMemo(() => {
    const out = {}; let idx = 0;
    (METRIC_TREE[category] || []).forEach(g => { out[g.name] = idx++; });
    return out;
  }, [category]);
  /* v5.0 (260519) 수정 — 「일반 지표」 탭 일괄 제거 (별도 히스토리 메뉴 존재).
     성능 지표만 단일 뷰로 표출. tab 상태/일반지표 useMemo/useEffect 모두 제거. */
  const perfMetrics = useMemo(() => {
    return selectedMetricIds.filter(m => !GENERAL_METRIC_IDS.has(m)).sort((a, b) => {
      const ga = groupOrder[METRIC_GROUP[a]] ?? 999;
      const gb = groupOrder[METRIC_GROUP[b]] ?? 999;
      return ga - gb;
    });
  }, [selectedMetricIds.join(','), groupOrder]);
  const shownMetrics = perfMetrics;
  const fmt = (v, m) => {
    if (!Number.isFinite(v)) return '-';
    if (m && INT_METRIC_IDS.has(m)) return String(Math.round(v));
    return v.toFixed(2);
  };
  /* v5.0 (260519) — 데이터 테이블 행 조회 개수 선택형 (default 20 / 50 / 100) */
  const PAGE_OPTS = [20, 50, 100];
  const [pageSize, setPageSize] = useState(20);
  /* RAW 샘플: 각 (tick × target) → 한 행. 시간 내림차순(최신 위) · target 오름차순. */
  const points = effectivePoints(stepObj.id, dateRange);
  const allRows = useMemo(() => {
    const out = [];
    for(let i = points - 1; i >= 0; i--){
      const ts = tickLabel(stepObj.id, dateRange, i);
      selectedTargets.forEach(t => {
        const cells = {};
        shownMetrics.forEach(m => {
          /* 시드 — target/metric을 전체 문자열로 해싱해 m-life vs m-active 가 절대 같은 값이 나오지 않게 한다 */
          let th = 5381; for(let k=0;k<t.id.length;k++) th = ((th<<5) + th + t.id.charCodeAt(k)) >>> 0;
          let mh = 5381; for(let k=0;k<m.length; k++) mh = ((mh<<5) + mh + m.charCodeAt(k)) >>> 0;
          const seed = (th * 41 + mh * 13 + i * 131 + stepObj.id.charCodeAt(0) * 2) >>> 0;
          const r = seedRand(seed);
          let avg, mn, mx;
          if (m.includes('rate') || m.includes('cpu') || m.includes('cont')) {
            avg = +(r()*60+20).toFixed(2);
            mn = +(Math.max(0, avg - r()*15)).toFixed(2);
            mx = +(Math.min(100, avg + r()*30)).toFixed(2);
          } else if (m.includes('mem') && !m.includes('m-')) {
            avg = +(r()*15+8).toFixed(2); mn = +(avg-r()*3).toFixed(2); mx = +(avg+r()*4).toFixed(2);
          } else if (m.includes('bw') || m.includes('tp')) {
            avg = +(r()*400+100).toFixed(2); mn = +(avg-r()*60).toFixed(2); mx = +(avg+r()*120).toFixed(2);
          } else if (m.includes('err') || m.includes('drop')) {
            avg = +(r()*0.5).toFixed(2); mn = 0; mx = +(avg+r()*0.6).toFixed(2);
          } else if (m==='m-life' || m==='m-active') {
            avg = +(r()*22+1).toFixed(2);
            mn  = +(Math.max(0, avg - r()*3)).toFixed(2);
            mx  = +(Math.min(24, avg + r()*3)).toFixed(2);
          } else if (m==='m-active-rate') {
            avg = +(r()*70+25).toFixed(2); mn = +(Math.max(0,avg-r()*15)).toFixed(2); mx = +(Math.min(100,avg+r()*15)).toFixed(2);
          } else if (m==='m-vol-cnt') {
            avg = Math.round(r()*8+1);
            mn  = Math.max(0, avg - Math.round(r()*2));
            mx  = avg + Math.round(r()*3);
          } else if (m==='m-vol-size') {
            avg = +(r()*500+50).toFixed(2); mn = +(avg-r()*40).toFixed(2); mx = +(avg+r()*80).toFixed(2);
          } else if (m==='m-vcpu') {
            avg = Math.round(r()*16+2);
            mn  = avg;
            mx  = avg + Math.round(r()*4);
          } else if (m==='m-vmem') {
            avg = +(r()*64+4).toFixed(2); mn = +(avg-r()*4).toFixed(2); mx = +(avg+r()*8).toFixed(2);
          } else {
            avg = +(r()*100).toFixed(2); mn = +(Math.max(0,avg-r()*20)).toFixed(2); mx = +(avg+r()*30).toFixed(2);
          }
          /* v5.0 — median: min~max 사이, avg와는 약간 어긋남 (정수 지표는 정수로) */
          let med;
          if (INT_METRIC_IDS.has(m)) {
            med = Math.max(mn, Math.min(mx, Math.round(avg + (r()-0.5) * 2)));
          } else {
            med = +Math.max(mn, Math.min(mx, avg + (r()-0.5) * Math.max(0.5, (mx - mn) * 0.35))).toFixed(2);
          }
          cells[m] = { min: mn, avg, max: mx, median: med };
        });
        out.push({ tick: ts, tickIdx: i, target: t, cells });
      });
    }
    return out;
  }, [selectedTargets.map(t=>t.id).join(','), shownMetrics.join(','), stepObj.id, dateRange.start, dateRange.end, points]);
  const totalRows = allRows.length;
  const rows = allRows.slice(0, pageSize);

  const closedSummary = (
    <><b style={{color:'var(--ink)'}}>{totalRows.toLocaleString()}</b> rows (RAW 샘플) — {points} tick × {selectedTargets.length} targets × {selectedMetricIds.length} metrics. 펼쳐서 표를 확인하세요.</>
  );
  return (
    <Accordion
      title="④ 데이터 테이블"
      sub={'RAW 샘플 — 행 = 수집 기준 시점 × 대상 · ' + (totalRows > pageSize ? `상위 ${pageSize}행 표시 (행 수 선택 가능)` : '전체 표시')}
      defaultOpen={false}
      badge={<span className="wf-tag">{totalRows.toLocaleString()} rows · {pageSize}/page</span>}
      summaryWhenClosed={closedSummary}
      footer={
        <div className="csv-bar" style={{alignItems:'flex-start'}}>
          <div className="hint" style={{flex:1}}>
            CSV 다운로드 — 행: <b>수집 기준 시점 × 대상</b> / 열: <b>기준시간·대상명·그룹·(지표 × min/max/avg)</b> ·
            <span style={{color:'var(--ink-3)'}}> 파일명 <code>aggregation_report_{baseDateOf(dateRange.end).replaceAll('-','').replaceAll(' ','_')}_target.csv</code> · UTF-8 BOM · 단일 파일 100,000행 한계</span>
            <div style={{marginTop:4, color:'var(--ink-2)', fontSize:11.5, lineHeight:1.55, paddingTop:4, borderTop:'1px dashed var(--line)'}}>
              <b style={{color:'var(--ink)'}}>※ 100,000행 초과 시</b> 파일을 자동 분할 다운로드합니다 — 파일명 뒤에 <code>(1/N)</code> · <code>(2/N)</code> … 형식으로 전체 분할 수 중 몇 번째인지 표기합니다.
              <div style={{marginTop:2, color:'var(--ink-3)', fontSize:10.5}}>
                예) 250,000행 → <code>aggregation_report_{baseDateOf(dateRange.end).replaceAll('-','').replaceAll(' ','_')}_target (1/3).csv</code>, <code>… (2/3).csv</code>, <code>… (3/3).csv</code> 3개 파일로 분할
              </div>
            </div>
            <div style={{marginTop:6, color:'#854f0b', fontSize:11}}>※ 기간 요약 뷰는 <b>고도화 단계로 이관</b> — 본 화면은 RAW 샘플 표출</div>
          </div>
          <button className="wf-btn primary" onClick={onCsv} style={{alignSelf:'center'}}>↓ CSV 다운로드</button>
        </div>
      }>
      <div className="table-tabs">
        {/* v5.0 (260519) 수정 — 「일반 지표」 탭 일괄 제거: 성능 지표 단일 헤더로 전환 */}
        <span style={{padding: '9px 14px', fontSize: 12.5, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 6, color:'var(--ink)', background:'#fff', border:'1.5px solid var(--ink)', borderBottomColor:'#fff', position:'relative', top:'1.5px'}}>
          성능 지표 <span style={{fontSize:10.5, padding:'1px 6px', border:'1px solid var(--ink)', borderRadius:999, background:'var(--ink)', color:'#fff', fontWeight:600}}>{shownMetrics.length}</span>
        </span>
        <span className="table-tab-note">
          ※ 성능 지표는 <b style={{color:'var(--ink)'}}>min / avg / max / median</b> 4계열 동시 표출 <span style={{marginLeft:4, fontSize:9, padding:'1px 4px', background:'var(--hi)', border:'1px solid var(--ink)', fontWeight:600, letterSpacing:'.04em'}}>v5.0</span>
        </span>
        {/* v5.0 — 행 조회 개수 선택 (default 20 · 50 · 100) */}
        <span style={{marginLeft: 10, display:'inline-flex', alignItems:'center', gap:6, alignSelf:'center', fontSize:11, color:'var(--ink-3)', paddingRight: 6}}>
          <span>행 조회 개수</span>
          <select className="wf-select" style={{padding:'3px 22px 3px 8px', fontSize:11.5}} value={pageSize} onChange={e=>setPageSize(+e.target.value)} title="한 화면에 표시할 행 수 (default 20)">
            {PAGE_OPTS.map(n => <option key={n} value={n}>{n}행</option>)}
          </select>
          <span style={{color:'var(--ink-2)'}}>/ <b style={{color:'var(--ink)'}}>{totalRows.toLocaleString()}</b>행</span>
        </span>
      </div>
      {/* v5.0 (260519) 수정 — 「일반 지표」 탭 제거에 따라 인스턴스 상태 warning 일괄 제거 */}
      <div className="table-scroll vscroll">
        {selectedTargets.length === 0 ? (
          <div style={{padding: 30, textAlign:'center', color:'var(--ink-3)'}}>▢ 대상을 선택하면 표가 채워집니다.</div>
        ) : selectedMetricIds.length === 0 ? (
          <div style={{padding: 30, textAlign:'center', color:'var(--ink-3)'}}>▢ 지표를 1개 이상 선택하세요.</div>
        ) : shownMetrics.length === 0 ? (
          <div style={{padding: 30, textAlign:'center', color:'var(--ink-3)'}}>
            ▢ ② 지표 선택에서 CPU·메모리·네트워크·디스크 지표를 1개 이상 선택하세요.
          </div>
        ) : (
          <table className="data-table">
            <thead>
            {(() => {
              /* v5.0 (260519) 수정 — 「일반 지표」 탭 제거: 3계층 헤더 고정 */
              const rowSpanN = 3;
              const spans = [];
              shownMetrics.forEach(m => {
                const grp = METRIC_GROUP[m] || '—';
                const cols = aggColsFor(m).length;
                const last = spans[spans.length-1];
                if (last && last.name === grp) last.cols += cols;
                else spans.push({ name: grp, cols });
              });
              return (
                  <tr className="lvl0">
                    <th rowSpan={rowSpanN} className="hdr-frozen lvl0 lvl-anchor" style={{verticalAlign:'middle', minWidth: 156}}>{tickColumnLabel(stepObj.id).split(' (')[0]}
                      <div style={{fontSize:10, color:'var(--ink-3)', fontWeight:400, textTransform:'none', letterSpacing:0}}>{tickColumnLabel(stepObj.id).match(/\((.+)\)/)?.[1] || ''} · step = {stepObj?.label || '—'}</div>
                    </th>
                    <th rowSpan={rowSpanN} className="hdr-frozen lvl0 lvl-anchor" style={{verticalAlign:'middle'}}>대상명</th>
                    <th rowSpan={rowSpanN} className="hdr-frozen lvl0 lvl-anchor" style={{verticalAlign:'middle'}}>그룹</th>
                    {spans.map((s, i) => (
                      <th key={i} colSpan={s.cols} className="lvl0" style={{textAlign:'center', borderLeft:'1.5px solid var(--ink)', background:'var(--paper-2)'}}>{s.name}</th>
                    ))}
                  </tr>
              );
            })()}
              <tr className="lvl1">
                {shownMetrics.map((m, mi) => (
                  <th key={m} colSpan={aggColsFor(m).length} className="lvl1" style={{textAlign:'center', borderLeft: '1.5px solid var(--ink)'}}>
                    <div style={{display:'flex', alignItems:'center', justifyContent:'center', gap:4, lineHeight:1.3}}>
                      <span>{metricMap[m]?.label || m}</span>
                      <span style={{fontSize:10, color:'var(--ink-3)', fontWeight:400}}>({METRIC_UNITS[m] || '—'})</span>
                      <span className="info-i" style={{marginLeft:2}}>?</span>
                    </div>
                  </th>
                ))}
              </tr>
              <tr className="lvl2">
                {shownMetrics.map(m => (
                  <React.Fragment key={m}>
                    {aggColsFor(m).map((col, ci) => (
                      <th key={col} className="lvl2" style={{textAlign:'right', borderLeft: ci === 0 ? '1.5px solid var(--ink)' : undefined}}>{col}</th>
                    ))}
                  </React.Fragment>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((row, ri) => {
                const prev = ri > 0 ? rows[ri-1] : null;
                const tickChanged = !prev || prev.tick !== row.tick;
                return (
                  <tr key={row.tick + '|' + row.target.id} style={tickChanged ? {borderTop: '1px solid var(--ink)'} : null}>
                    <td style={{color:'var(--ink-2)', whiteSpace:'nowrap'}}>
                      {tickChanged ? <b style={{color:'var(--ink)', fontFeatureSettings:'"tnum"'}}>{row.tick}</b> : <span style={{color:'var(--ink-3)'}}>↑ {row.tick}</span>}
                    </td>
                    <td><b>{row.target.name}</b></td>
                    <td style={{color:'var(--ink-3)'}}>{row.target.group}</td>
                    {shownMetrics.map(m => {
                      const cell = row.cells[m] || { min:0, avg:0, max:0, median:0 };
                      const cols = aggColsFor(m);
                      return (
                        <React.Fragment key={m}>
                          {cols.map((col, ci) => (
                            <td key={col} className={'num ' + col} style={{textAlign:'right', borderLeft: ci === 0 ? '1.5px solid var(--ink)' : undefined}}>{fmt(cell[col], m)}</td>
                          ))}
                        </React.Fragment>
                      );
                    })}
                  </tr>
                );
              })}
              {totalRows > pageSize && (
                <tr>
                  <td colSpan={3 + shownMetrics.reduce((a,m)=>a+aggColsFor(m).length,0)} style={{padding: '10px 14px', textAlign:'center', color:'var(--ink-3)', fontSize:11, background:'#fbfaf6', borderTop:'1.5px dashed var(--ink-3)'}}>
                    … 표시 <b style={{color:'var(--ink)'}}>{pageSize.toLocaleString()}</b>행 / 전체 <b style={{color:'var(--ink)'}}>{totalRows.toLocaleString()}</b>행 — 행 수 셀렉터에서 <b style={{color:'var(--ink-2)'}}>최대 100행</b>까지 늘리거나, CSV로 내려받으세요
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        )}
      </div>
    </Accordion>
  );
}

/* BarChart list (v2.0 미터링 지표 전용) — 대상별 수평 막대로 누적 값을 표시. 시계열 아닌 하나의 대표값(궁극적 누적 또는 avg)을 비교. */
function BarList({ targets, axis, getValue, unitLabel, sort=true }) {
  const rows = useMemo(() => {
    const arr = targets.map((t,i) => ({ t, v: getValue(t, i) || 0 }));
    if(sort) arr.sort((a,b) => b.v - a.v);
    return arr;
  }, [targets.map(t=>t.id).join(','), sort]);
  if(rows.length===0) return null;
  const maxV = Math.max(axis.hi, ...rows.map(r=>r.v), 1);
  return (
    <div style={{display:'flex', flexDirection:'column', gap:5, padding:'4px 2px', maxHeight: 240, overflowY:'auto'}}>
      {rows.map((r,i) => {
        const pct = Math.max(2, (r.v / maxV) * 100);
        const top1 = i === 0;
        return (
          <div key={r.t.id} style={{display:'grid', gridTemplateColumns:'118px 1fr 64px', gap:8, alignItems:'center', fontSize:11.5}}>
            <span style={{whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', color: top1?'var(--ink)':'var(--ink-2)', fontWeight: top1?700:500}} title={r.t.name + ' · ' + r.t.group}>
              <span style={{color: top1?'#a82323':'var(--ink-3)', marginRight:4, fontFamily:'inherit'}}>{String(i+1).padStart(2,'0')}.</span>
              {r.t.name}
            </span>
            <span style={{position:'relative', height:18, background:'var(--paper-2)', border:'1px solid var(--line)'}}>
              <span style={{position:'absolute', inset:'0 auto 0 0', width: pct+'%', background: top1?'var(--ink)':SERIES_COLORS[i%SERIES_COLORS.length], opacity: top1?1:.75}}></span>
            </span>
            <span className="num" style={{textAlign:'right', fontFeatureSettings:'"tnum"', fontWeight: top1?700:500}}>
              {r.v.toFixed(unitLabel==='%'?1:0)}<span style={{color:'var(--ink-3)', marginLeft:2, fontSize:10}}>{unitLabel}</span>
            </span>
          </div>
        );
      })}
    </div>
  );
}

function LineSvg({ width, height, series, axis, stepObj, aggToggles, dateRange, points: pointsProp, unitLabel }) {
  const padL = 44, padR = 12, padT = 14, padB = 22;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;
  const points = pointsProp || stepObj.points;
  const xFor = i => padL + (points === 1 ? innerW/2 : (i / (points - 1)) * innerW);
  const yFor = v => padT + innerH - ((v - axis.lo) / (axis.hi - axis.lo || 1)) * innerH;
  const yTicks = 4;
  const ticks = Array.from({length: yTicks + 1}, (_, i) => axis.lo + (axis.hi - axis.lo) * (i / yTicks));
  /* X축 라벨 간격 — step별 예상 라벨 폭에 맞춰 stride 산정 (겹침 방지) */
  const labelPxByStep = { hourly: 22, daily: 44, weekly: 46, monthly: 44 };
  const labelW = labelPxByStep[stepObj.id] || 42;
  const labelStride = Math.max(1, Math.ceil((points * labelW) / Math.max(80, innerW)));

  /* v5.0 (260519) 수정 — 라인 호버 시 레전드별 다값(Max/Median/Avg/Min) CSV 툴팁 */
  const [hoverIdx, setHoverIdx] = useState(null);
  const svgRef = React.useRef(null);
  const onMove = (e) => {
    const node = svgRef.current; if (!node) return;
    const r = node.getBoundingClientRect();
    const xRel = e.clientX - r.left;
    if (xRel < padL || xRel > padL + innerW) { setHoverIdx(null); return; }
    const t = points <= 1 ? 0 : (xRel - padL) / innerW;
    const idx = Math.max(0, Math.min(points - 1, Math.round(t * (points - 1))));
    setHoverIdx(idx);
  };
  const onLeave = () => setHoverIdx(null);
  const fmtVal = (v) => {
    if (!Number.isFinite(v)) return '-';
    if (Math.abs(v) >= 1000) return v.toFixed(0);
    return (Math.round(v * 10) / 10).toFixed(1);
  };
  const unitSuffix = (unitLabel === '%') ? '%' : (unitLabel ? ` ${unitLabel}` : '');
  /* 툴팁 박스 placement — 호버 위치가 좌측이면 우측, 우측이면 좌측에 표시 */
  const tipW = Math.min(360, Math.max(220, innerW - 16));
  const tipH = Math.min(160, 22 + Math.max(1, series.length) * 16);
  const tipOnRight = hoverIdx !== null && xFor(hoverIdx) < (padL + innerW / 2);
  const tipX = tipOnRight ? (padL + innerW - tipW - 4) : (padL + 4);
  const tipY = padT + 2;

  return (
    <svg ref={svgRef} width={width} height={height} style={{display:'block', overflow:'visible'}} onMouseMove={onMove} onMouseLeave={onLeave}>
      {ticks.map((t, i) => (
        <g key={i}>
          <line className="grid-line" x1={padL} x2={padL+innerW} y1={yFor(t)} y2={yFor(t)} />
          <text className="yaxis" x={padL-6} y={yFor(t)+3} textAnchor="end">{Number(t.toFixed(t<10?2:0))}</text>
        </g>
      ))}
      <line className="axis-line" x1={padL} x2={padL+innerW} y1={padT+innerH} y2={padT+innerH} />
      {unitLabel && <text className="yaxis" x={padL-4} y={padT-4} textAnchor="end" style={{fontWeight:600, fill:'var(--ink-2)', fontSize:10}}>{unitLabel}</text>}
      {/* 호버 캡처용 투명 박스 (라인 사이 빈공간에서도 hover 감지) */}
      <rect x={padL} y={padT} width={innerW} height={innerH} fill="transparent" />
      {Array.from({length: points}).map((_, i) => (
        (i%labelStride===0 || i===points-1) && (
          <text key={i} className="xaxis" x={xFor(i)} y={padT+innerH+14} textAnchor="middle">{stepObj.xfmt(i, dateRange)}</text>
        )
      ))}
      {series.map((s, si) => {
        const color = s.color;
        const variants = [];
        ['min','max','median','avg'].forEach(k => {
          if (aggToggles[k]) {
            const st = AGG_STYLE[k];
            variants.push({ k, dash: st.dash, op: st.op, w: st.w });
          }
        });
        return (
          <g key={si}>
            {variants.map(v => {
              const d = s.data.map((p, i) => `${i===0?'M':'L'} ${xFor(i)} ${yFor(p[v.k])}`).join(' ');
              return (
                <g key={v.k}>
                  <path d={d} stroke={color} strokeWidth={v.w} fill="none" strokeDasharray={v.dash||''} opacity={v.op} />
                  {v.k === 'avg' && points <= 40 && s.data.map((p,i)=>(
                    <circle key={i} cx={xFor(i)} cy={yFor(p.avg)} r={2.4} fill={color} opacity={v.op}/>
                  ))}
                </g>
              );
            })}
          </g>
        );
      })}
      {/* 호버 가이드 + 다값 툴팁 */}
      {hoverIdx !== null && series.length > 0 && (
        <g pointerEvents="none">
          <line x1={xFor(hoverIdx)} x2={xFor(hoverIdx)} y1={padT} y2={padT+innerH} stroke="#1a1a1a" strokeOpacity={.4} strokeWidth={1} strokeDasharray="3 3"/>
          {series.map((s, si) => {
            const p = s.data[hoverIdx]; if (!p) return null;
            return (
              <g key={si}>
                {aggToggles.avg && <circle cx={xFor(hoverIdx)} cy={yFor(p.avg)} r={4} fill={s.color} stroke="#fff" strokeWidth={1.5}/>}
                {aggToggles.max && <circle cx={xFor(hoverIdx)} cy={yFor(p.max)} r={2.5} fill={s.color} stroke="#fff" strokeWidth={1}/>}
                {aggToggles.median && <circle cx={xFor(hoverIdx)} cy={yFor(p.median)} r={2.5} fill={s.color} stroke="#fff" strokeWidth={1}/>}
                {aggToggles.min && <circle cx={xFor(hoverIdx)} cy={yFor(p.min)} r={2.5} fill={s.color} stroke="#fff" strokeWidth={1}/>}
              </g>
            );
          })}
          <foreignObject x={tipX} y={tipY} width={tipW} height={tipH}>
            <div xmlns="http://www.w3.org/1999/xhtml" style={{fontFamily:'inherit', fontSize:10.5, background:'rgba(255,255,255,0.97)', border:'1px solid #1a1a1a', boxShadow:'2px 2px 0 rgba(0,0,0,0.08)', padding:'5px 7px', lineHeight:1.45}}>
              <div style={{fontSize:9.5, color:'#666', marginBottom:3, letterSpacing:'.04em', textTransform:'uppercase', borderBottom:'1px dashed #d0d0d0', paddingBottom:2}}>
                x = <b style={{color:'#1a1a1a', textTransform:'none', letterSpacing:0}}>{stepObj.xfmt(hoverIdx, dateRange)}</b>
              </div>
              {series.map((s, si) => {
                const p = s.data[hoverIdx];
                if (!p) return null;
                return (
                  <div key={si} style={{display:'flex', alignItems:'center', gap:5, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', padding:'1px 0'}}>
                    <span style={{width:10, height:2, background:s.color, display:'inline-block', flexShrink:0}}></span>
                    <b style={{color:'#1a1a1a', flexShrink:0}}>{s.label}</b>
                    <span style={{color:'#999', flexShrink:0}}>—</span>
                    <span style={{color:'#333', fontVariantNumeric:'tabular-nums'}}>Max: {fmtVal(p.max)}{unitSuffix}, Median: {fmtVal(p.median)}{unitSuffix}, Avg: {fmtVal(p.avg)}{unitSuffix}, Min: {fmtVal(p.min)}{unitSuffix}</span>
                  </div>
                );
              })}
            </div>
          </foreignObject>
        </g>
      )}
    </svg>
  );
}

function ChartCard({ group, stepObj, selectedTargets, forceNoData, dateRange, onZoom }) {
  /* v5.0 (260519) — 차트 타입 라인으로 통일 (Area 미사용 제거). BarList는 미터링 그룹용이었으나 분리됨. */
  const chartType = 'line';
  /* v5.0 (260519) 수정 — default 표출 라인 = avg 만 ON (max/min/median 은 사용자 토글로 옥션) */
  const [aggToggles, setAggToggles] = useState({ avg: true, max: false, min: false, median: false });
  const points = effectivePoints(stepObj.id, dateRange);
  const series = useMemo(() => {
    if (forceNoData) return [];
    if (selectedTargets.length === 0) return [];
    return selectedTargets.slice(0, 8).map((t, i) => {
      const seed = (t.id.charCodeAt(t.id.length-1) * 37 + group.id.charCodeAt(0) * 11 + i * 7 + stepObj.id.charCodeAt(0)*5) >>> 0;
      let base, amp, ceil=100;
      if (group.unit === '%') { base = 35 + (i*7)%30; amp = 25; ceil = 100; }
      else if (group.unit.includes('GB')) { base = 18 + (i*4)%20; amp = 10; ceil = 64; }
      else if (group.unit.includes('Mbps')) { base = 200 + (i*45)%200; amp = 150; ceil = 1000; }
      else if (group.unit.includes('pkt')) { base = 1200 + (i*200)%2000; amp = 800; ceil = 8000; }
      else if (group.unit === 'h') { base = 0.4 + (i*0.15)%0.6; amp = 0.4; ceil = 1; }
      else if (group.unit.includes('cps')) { base = 60 + (i*8)%40; amp = 30; ceil = 300; }
      else if (group.unit === 'hour') { base = 80 + (i*40)%500; amp = 120; ceil = 720; }
      else if (group.unit === 'ea')   { base = 2  + (i*2)%6;   amp = 2;   ceil = 16; }
      else if (group.unit === 'core') { base = 4  + (i*2)%12;  amp = 4;   ceil = 64; }
      else { base = 30 + (i*5)%30; amp = 20; ceil = 100; }
      return { label: t.name, color: SERIES_COLORS[i % SERIES_COLORS.length], data: genSeries(seed, points, base, amp, 0, ceil) };
    });
  }, [group.id, stepObj.id, selectedTargets.map(t=>t.id).join(','), points]);
  const allValues = useMemo(() => {
    let max = 0, min = Infinity;
    series.forEach(s => s.data.forEach(d => { max = Math.max(max, d.max); min = Math.min(min, d.min); }));
    return { max, min };
  }, [series]);
  const axis = metricAxis(group.id, allValues, group.unit);

  return (
    <div className="chart-card">
      <div className="chart-head">
        <span className="chart-title">
          {group.parentName && <span style={{fontSize:10.5, color:'var(--ink-3)', fontWeight:500, marginRight:4}}>{group.parentName} ·</span>}
          {group.title}
          {group.isNew && <span style={{marginLeft:4, fontSize:9, padding:'1px 5px', background:'var(--hi)', border:'1px solid var(--ink)', fontWeight:700, letterSpacing:'.06em'}}>NEW</span>}
          {/* v5.0 (260519) 수정 — [LINE] 차트 타입 배지 제거 (디자인시 명칭 변경 가능성) */}
          {group.members.map((m, i) => (
            <span key={i} className="info-i" title={"지표 산정 근거 — " + m}>?</span>
          ))}
          <span style={{fontSize:10, color:'var(--ink-3)', fontWeight: 400, marginLeft: 4}}>{group.unit}</span>
        </span>
        <div className="agg-toggles" title="min / avg / max / median 표출 토글 (v5.0)">
          {['avg','max','min','median'].map(k => (
            <label key={k} className={aggToggles[k]?'on':''} onClick={(e)=>{ e.preventDefault(); setAggToggles(s=>({...s, [k]: !s[k]})); }}>
              <span className={'wf-check ' + (aggToggles[k]?'on':'')} style={{width:10, height:10, borderColor: aggToggles[k]?'#fff':'var(--ink)'}}></span>
              {k}
            </label>
          ))}
        </div>
        <div className="chart-actions">
          <button className="zoom-btn" title="차트 확대" onClick={()=>onZoom && onZoom({ group, series, axis, aggToggles, chartType })}>⌬ 확대</button>
        </div>
      </div>
      {group.note && <div className="chart-note">⚠ {group.note}</div>}
      <div className="chart-body">
        {forceNoData ? (
          <div className="wf-stripe" style={{height: 180, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:6, color:'var(--ink-3)', border:'1px dashed var(--line)', background:'repeating-linear-gradient(45deg, transparent 0 6px, #f3f3f3 6px 12px)'}}>
            <span style={{fontSize:13, fontWeight:600, color:'var(--ink-2)'}}>No Data</span>
            <span style={{fontSize:11}}>선택한 기간·대상에 해당하는 데이터가 없습니다</span>
          </div>
        ) : selectedTargets.length === 0 ? (
          <div className="wf-stripe" style={{height: 160, display:'flex', alignItems:'center', justifyContent:'center', color:'var(--ink-3)', border:'1px dashed var(--line)'}}>대상 미선택</div>
        ) : (
          <LineSvg width={620} height={180} series={series} axis={axis} stepObj={stepObj} aggToggles={aggToggles} dateRange={dateRange} points={points} unitLabel={group.unit} />
        )}
      </div>
      <div className="chart-legend">
        {series.length === 0
          ? <span style={{color:'var(--ink-3)'}}>(대상 선택 시 범례 표출)</span>
          : <>
              {series.map((s, i) => (
                <span key={i}><span className="lgnd-sw" style={{background: s.color}}></span>{s.label}</span>
              ))}
              <span style={{marginLeft:'auto', color:'var(--ink-3)', fontSize:10.5, display:'flex', gap:10, alignItems:'center'}}>
                <span><span style={{display:'inline-block', width:14, height:0, borderTop:'1.8px solid var(--ink-2)', verticalAlign:'middle', marginRight:3}}></span>avg</span>
                <span><span style={{display:'inline-block', width:14, height:0, borderTop:'1.1px dashed var(--ink-2)', verticalAlign:'middle', marginRight:3}}></span>max</span>
                <span><span style={{display:'inline-block', width:14, height:0, borderTop:'1.1px dotted var(--ink-2)', verticalAlign:'middle', marginRight:3}}></span>min</span>
                <span><span style={{display:'inline-block', width:14, height:0, borderTop:'1.4px dashed var(--ink-2)', borderTopStyle:'dotted', verticalAlign:'middle', marginRight:3}}></span>median</span>
              </span>
            </>
        }
      </div>
    </div>
  );
}
